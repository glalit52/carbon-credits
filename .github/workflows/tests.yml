name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The core has no dependencies on purpose, so there is nothing to
      # install but the test runner itself.
      - run: pip install pytest
      - run: python -m pytest -q

      # The dashboard is committed rather than built on deploy, so it can
      # drift from the code that generates it. Rebuilding here catches that:
      # if the data no longer matches, the diff is non-empty and this fails.
      - name: dashboard is in sync with the code that generates it
        run: |
          python3 scripts/build_dashboard_data.py
          python3 scripts/build_dashboard.py
          if ! git diff --quiet -- dashboard/data.json dashboard/index.html; then
            echo "::error::dashboard/ is stale — run scripts/build_dashboard_data.py"
            git diff --stat -- dashboard/data.json dashboard/index.html
            exit 1
          fi

      - name: static build succeeds
        run: bash scripts/build_static.sh
