[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carbonstack"
version = "0.2.0"
description = "Earth-observation products: carbonstack (dMRV) and terrashield (geospatial intelligence)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
carbonstack = "carbonstack.cli:main"
terrashield = "terrashield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
