[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carbonstack"
version = "0.1.0"
description = "dMRV core for land-based carbon projects"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
carbonstack = "carbonstack.cli:main"
aicio = "aicio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The dashboard template ships inside the package: it is data the build script
# reads, not something to be regenerated at install time.

